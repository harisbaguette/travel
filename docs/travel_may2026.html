<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 5월 1주 해외여행 후보</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg: #0f0f13;
  --card: #1a1a22;
  --card-hover: #22222e;
  --border: #2a2a36;
  --text: #e8e8ec;
  --text2: #8888a0;
  --text3: #555568;
  --accent: #6c5ce7;
  --green: #00d2a0;
  --orange: #f0a040;
  --red: #ff4d6a;
  --blue: #4dabf7;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
.header {
  padding: 28px 32px 20px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 0%, #a8a8ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-sub {
  margin-top: 6px; font-size: 13px; color: var(--text2);
  display: flex; gap: 16px; flex-wrap: wrap;
}
.header-tag {
  background: rgba(108,92,231,0.15); color: #a89eff;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
}

/* ─── FILTERS ─── */
.filters-wrap {
  padding: 16px 32px;
  background: rgba(26,26,34,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.filters {
  display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
}
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
.fg-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.fb {
  padding: 5px 12px; border: 1.5px solid var(--border); border-radius: 20px;
  cursor: pointer; font-size: 11px; font-weight: 500;
  background: transparent; color: var(--text2);
  transition: all 0.2s; white-space: nowrap;
}
.fb:hover { border-color: var(--accent); color: var(--accent); }
.fb.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.reset-btn {
  padding: 5px 14px; border: 1.5px solid var(--border); border-radius: 20px;
  cursor: pointer; font-size: 11px; background: transparent; color: var(--text3);
  transition: all 0.2s; align-self: flex-end;
}
.reset-btn:hover { border-color: var(--red); color: var(--red); }

/* ─── INFO BAR ─── */
.info-bar {
  padding: 10px 32px; font-size: 12px; color: var(--text3);
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(42,42,54,0.5);
}
.info-bar b { color: var(--accent); font-size: 16px; }

/* ─── CARDS ─── */
.cards-wrap { padding: 20px 32px 40px; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: all 0.25s;
  cursor: default;
  position: relative;
  overflow: hidden;
}
.card:hover {
  background: var(--card-hover);
  border-color: rgba(108,92,231,0.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.card.hidden { display: none; }
.card.is-new::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 3px; height: 100%; background: var(--green);
}

/* Card top row */
.card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px;
}
.card-score {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
  position: relative; flex-shrink: 0;
}
.card-score::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  padding: 2.5px;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.score-high { color: var(--green); }
.score-high::before { background: conic-gradient(var(--green) calc(var(--pct) * 3.6deg), var(--border) 0); }
.score-mid { color: var(--orange); }
.score-mid::before { background: conic-gradient(var(--orange) calc(var(--pct) * 3.6deg), var(--border) 0); }
.score-low { color: var(--red); }
.score-low::before { background: conic-gradient(var(--red) calc(var(--pct) * 3.6deg), var(--border) 0); }

.card-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.card-country { font-size: 12px; color: var(--text2); font-weight: 500; }
.card-cost {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
}
.cost-l { background: rgba(0,210,160,0.12); color: var(--green); }
.cost-m { background: rgba(240,160,64,0.12); color: var(--orange); }
.cost-h { background: rgba(255,77,106,0.12); color: var(--red); }

/* Card name */
.card-name {
  font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
  margin-bottom: 2px;
}
.card-en { font-size: 11px; color: var(--text3); margin-bottom: 12px; font-weight: 400; }
.badge {
  display: inline-block; padding: 2px 7px; border-radius: 8px;
  font-size: 9px; font-weight: 700; margin-left: 6px; vertical-align: middle;
  letter-spacing: 0.5px;
}
.badge-new { background: rgba(0,210,160,0.15); color: var(--green); }
.badge-top { background: rgba(240,160,64,0.15); color: var(--orange); }

/* Indicators row */
.indicators {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
}
.ind {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 8px;
  font-size: 11px; font-weight: 500;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.05);
}
.ind-icon { font-size: 13px; flex-shrink: 0; }
.ind-y { color: var(--green); }
.ind-p { color: var(--orange); }
.ind-n { color: var(--text3); }

/* Stars */
.star-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.star-label { font-size: 10px; color: var(--text3); width: 28px; font-weight: 600; }
.stars { display: flex; gap: 2px; }
.star { width: 14px; height: 14px; border-radius: 3px; }
.star-on { background: #f7c948; }
.star-off { background: rgba(255,255,255,0.06); }

/* Group & Note */
.card-group {
  font-size: 10px; color: var(--text3); line-height: 1.6;
  padding: 8px 10px; border-radius: 8px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  margin-bottom: 10px; white-space: pre-line;
}
.card-note {
  font-size: 11px; color: var(--text2); line-height: 1.6;
  border-top: 1px solid rgba(255,255,255,0.05);
  padding-top: 10px; margin-top: 4px;
}

/* ─── ELIMINATED ─── */
.eliminated {
  padding: 0 32px 40px;
}
.eli-title { font-size: 13px; color: var(--text3); font-weight: 600; margin-bottom: 10px; }
.eli-list { display: flex; flex-wrap: wrap; gap: 6px; }
.eli-item {
  padding: 5px 12px; border-radius: 20px; font-size: 11px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  color: var(--text3); display: flex; gap: 6px; align-items: center;
}
.eli-reason { color: var(--red); font-size: 10px; font-weight: 600; }

/* ─── SORT BAR ─── */
.sort-bar {
  padding: 0 32px 8px;
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.sort-label { font-size: 10px; color: var(--text3); font-weight: 600; }
.sort-btn {
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 16px;
  cursor: pointer; font-size: 10px; font-weight: 500;
  background: transparent; color: var(--text3); transition: all 0.15s;
}
.sort-btn:hover { border-color: var(--accent); color: var(--accent); }
.sort-btn.on { background: rgba(108,92,231,0.15); border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* ─── SCORE LEGEND ─── */
.legend {
  padding: 0 32px 16px;
  display: flex; gap: 20px; flex-wrap: wrap; font-size: 11px; color: var(--text3);
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

@media (max-width: 768px) {
  .header, .filters-wrap, .cards-wrap, .eliminated, .sort-bar, .legend { padding-left: 16px; padding-right: 16px; }
  .cards { grid-template-columns: 1fr; }
  .header h1 { font-size: 18px; }
}
</style>

// 추천 점수 계산
function calcScore(d) {
  let s = 0;
  s += d.beach * 5;                                    // 바다 25점
  s += d.food * 5;                                     // 미식 25점
  s += d.car==='y'? 20 : d.car==='p'? 12 : 0;         // 차없이 20점
  s += d.swim==='y'? 15 : d.swim==='p'? 8 : 0;        // 수영 15점
  s += d.direct==='y'? 10 : d.direct==='p'? 5 : 0;    // 직항 10점
  s += [0, 5, 4, 3, 2, 1][d.costLv];                  // 비용 5점
  return s;
}
D.forEach(d => d.score = calcScore(d));

const F = {country:"all",direct:"all",swim:"all",car:"all",cost:"all"};
let sortMode = "score";

function starHTML(n, max=5) {
  let h='';
  for(let i=1;i<=max;i++) h+=`<div class="star ${i<=n?'star-on':'star-off'}"></div>`;
  return h;
}

function render() {
  let arr = [...D];
  // Sort
  if(sortMode==="score") arr.sort((a,b)=>b.score-a.score);
  else if(sortMode==="flight") arr.sort((a,b)=>a.flightMin-b.flightMin);
  else if(sortMode==="cost") arr.sort((a,b)=>a.costLv-b.costLv);
  else if(sortMode==="food") arr.sort((a,b)=>b.food-a.food);
  else if(sortMode==="beach") arr.sort((a,b)=>b.beach-a.beach);
  else arr.sort((a,b)=>a.name.localeCompare(b.name,'ko'));

  const c=document.getElementById('cards');
  c.innerHTML='';
  let shown=0;
  arr.forEach(d=>{
    const vis=chk(d);
    if(vis) shown++;
    const scCls = d.score>=70?'score-high':d.score>=50?'score-mid':'score-low';
    const cCls = d.costLv<=2?'cost-l':d.costLv<=3?'cost-m':'cost-h';
    const div=document.createElement('div');
    div.className=`card${d.isNew?' is-new':''}${!vis?' hidden':''}`;
    div.innerHTML=`
      <div class="card-top">
        <div class="card-score ${scCls}" style="--pct:${d.score}">
          ${d.score}
        </div>
        <div class="card-meta">
          <div class="card-country">${d.flag} ${d.country}</div>
          <div class="card-cost ${cCls}">${d.costT}</div>
        </div>
      </div>
      <div class="card-name">
        ${d.name}
        ${d.score>=75?'<span class="badge badge-top">TOP</span>':''}
        ${d.isNew?'<span class="badge badge-new">NEW</span>':''}
      </div>
      <div class="card-en">${d.en}</div>
      <div class="indicators">
        <div class="ind">
          <span class="ind-icon">${d.direct==='y'?'✈️':d.direct==='p'?'🔄':'❌'}</span>
          <span class="ind-${d.direct==='y'?'y':d.direct==='p'?'p':'n'}">${d.directS}</span>
        </div>
        <div class="ind">
          <span class="ind-icon">⏱</span>
          <span>${d.flightT}</span>
        </div>
        <div class="ind">
          <span class="ind-icon">${d.car==='y'?'🚇':d.car==='p'?'🚕':'🚗'}</span>
          <span class="ind-${d.car==='y'?'y':d.car==='p'?'p':'n'}">${d.carS}</span>
        </div>
        <div class="ind">
          <span class="ind-icon">${d.swim==='y'?'🏊':d.swim==='p'?'🌊':'❄️'}</span>
          <span class="ind-${d.swim==='y'?'y':d.swim==='p'?'p':'n'}">${d.swimS}</span>
        </div>
      </div>
      <div class="star-row">
        <div class="star-label">미식</div>
        <div class="stars">${starHTML(d.food)}</div>
      </div>
      <div class="star-row">
        <div class="star-label">바다</div>
        <div class="stars">${starHTML(d.beach)}</div>
      </div>
      <div class="card-group">${d.group}</div>
      <div class="card-note">${d.note}</div>
    `;
    c.appendChild(div);
  });
  document.getElementById('cnt').innerHTML=`<b>${shown}</b>개 표시 중`;
}

function chk(d){
  const{country,direct,swim,car,cost}=F;
  if(country!=='all'&&d.country!==country) return false;
  if(direct==='yes'&&d.direct!=='y') return false;
  if(direct==='yp'&&d.direct==='n') return false;
  if(swim==='yes'&&d.swim!=='y') return false;
  if(swim==='yp'&&d.swim==='n') return false;
  if(car==='yes'&&d.car!=='y') return false;
  if(car==='yp'&&d.car==='n') return false;
  if(cost==='lm'&&d.costLv>2) return false;
  if(cost==='mid'&&d.costLv>3) return false;
  return true;
}

document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click',()=>{
    const f=b.dataset.f,v=b.dataset.v;
    F[f]=v;
    document.querySelectorAll(`[data-f="${f}"]`).forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    render();
  });
});

document.querySelectorAll('.sort-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    sortMode=b.dataset.s;
    document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    render();
  });
});

function resetAll(){
  Object.keys(F).forEach(k=>F[k]='all');
  document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b.dataset.v==='all'));
  render();
}

render();
</script>
